<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1050" viewBox="0 0 1900 1050" role="img" aria-labelledby="title desc">
  <title id="title">Team 11 two-laptop IoT server health monitoring architecture</title>
  <desc id="desc">Eight-stage closed-loop flow from Python server simulator through MQTT and Node-RED to storage, multi-model analytics, decision engine, MQTT control, and a digital-twin actuator.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#183b49"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#16323d" flood-opacity=".16"/></filter>
    <style>
      .title{font:700 31px Inter,Arial,sans-serif;fill:#102f3a}.subtitle{font:500 15px Inter,Arial,sans-serif;fill:#5b727a}.lane{fill:#f5fbfc;stroke:#8bb6bf;stroke-width:2;stroke-dasharray:8 7}.lane2{fill:#f9f7ff;stroke:#9e91c9;stroke-width:2;stroke-dasharray:8 7}.lane-title{font:700 18px Inter,Arial,sans-serif;letter-spacing:1.5px;fill:#245462}.lane-title2{font:700 18px Inter,Arial,sans-serif;letter-spacing:1.5px;fill:#564982}.box{fill:#fff;stroke:#2e5e69;stroke-width:2.2;rx:12;filter:url(#shadow)}.analytics{fill:#fff;stroke:#695a98;stroke-width:2.4;rx:14;filter:url(#shadow)}.sub{fill:#f7f5ff;stroke:#9388ba;stroke-width:1.7;rx:8}.eval{fill:#fbfcfd;stroke:#829aa2;stroke-width:1.5;stroke-dasharray:5 4;rx:8}.h{font:700 19px Inter,Arial,sans-serif;fill:#153a45}.h2{font:700 15px Inter,Arial,sans-serif;fill:#493f70}.p{font:500 13px Inter,Arial,sans-serif;fill:#526a72}.small{font:500 12px Inter,Arial,sans-serif;fill:#5f7076}.metric{font:600 12px Inter,Arial,sans-serif;fill:#394e55}.line{fill:none;stroke:#183b49;stroke-width:3;marker-end:url(#arrow)}.feedback{fill:none;stroke:#287d6b;stroke-width:3;stroke-dasharray:9 6;marker-end:url(#arrow)}.num{fill:#143d49;stroke:#fff;stroke-width:3}.numtext{font:700 15px Inter,Arial,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle}.topic{font:600 12px ui-monospace,SFMono-Regular,monospace;fill:#287d6b}.icon{fill:none;stroke:#2e5e69;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.selected{fill:#e4f8f2;stroke:#287d6b;stroke-width:2;rx:8}
    </style>
  </defs>
  <rect width="1900" height="1050" fill="#ffffff"/>
  <text x="950" y="42" text-anchor="middle" class="title">IoT-Based Server &amp; IT Infrastructure Health Monitoring</text>
  <text x="950" y="67" text-anchor="middle" class="subtitle">Two-laptop, EMQX Cloud, software-only closed-loop architecture · Team 11</text>

  <rect x="28" y="92" width="740" height="865" rx="18" class="lane"/>
  <text x="52" y="125" class="lane-title">EMQX CLOUD + LAPTOP 1 · IoT FLOW &amp; UI</text>
  <rect x="790" y="92" width="1080" height="865" rx="18" class="lane2"/>
  <text x="814" y="125" class="lane-title2">LAPTOP 2 · DATA, ANALYTICS &amp; ML</text>

  <!-- simulator -->
  <g transform="translate(820 160)">
    <rect width="210" height="190" class="box"/>
    <text x="105" y="34" text-anchor="middle" class="h">IoT Devices</text>
    <text x="105" y="56" text-anchor="middle" class="p">Python server simulator</text>
    <rect x="42" y="76" width="126" height="69" rx="7" class="sub"/>
    <path d="M60 125 V98 H77 V115 H94 V88 H111 V108 H128 V94 H149 V125" class="icon"/>
    <text x="105" y="170" text-anchor="middle" class="small">CSV replay · 4 servers · 1 min</text>
  </g>

  <!-- broker -->
  <g transform="translate(70 175)">
    <rect width="180" height="170" class="box"/>
    <text x="90" y="34" text-anchor="middle" class="h">MQTT Broker</text>
    <text x="90" y="56" text-anchor="middle" class="p">EMQX Cloud · TLS 8883</text>
    <ellipse cx="90" cy="88" rx="42" ry="14" class="icon"/><path d="M48 88v42c0 8 19 14 42 14s42-6 42-14V88M48 108c0 8 19 14 42 14s42-6 42-14" class="icon"/>
  </g>

  <!-- node red -->
  <g transform="translate(300 175)">
    <rect width="215" height="170" class="box"/>
    <text x="108" y="34" text-anchor="middle" class="h">Node-RED</text>
    <text x="108" y="56" text-anchor="middle" class="p">Validation &amp; flow processing</text>
    <circle cx="65" cy="104" r="14" class="icon"/><circle cx="151" cy="87" r="14" class="icon"/><circle cx="151" cy="127" r="14" class="icon"/><path d="M79 103 L137 88 M79 107 L137 125" class="icon"/>
    <text x="108" y="154" text-anchor="middle" class="small">raw → validated → processed</text>
  </g>

  <!-- dashboard -->
  <g transform="translate(555 175)">
    <rect width="180" height="170" class="box"/>
    <text x="90" y="34" text-anchor="middle" class="h">Dashboard</text>
    <text x="90" y="56" text-anchor="middle" class="p">Operator visualization</text>
    <rect x="37" y="76" width="106" height="60" rx="5" class="icon"/><path d="M51 119l20-18 18 11 22-26 17 13" class="icon"/><path d="M76 145h28" class="icon"/>
    <text x="90" y="158" text-anchor="middle" class="small">Browser · Node-RED debug</text>
  </g>

  <!-- database -->
  <g transform="translate(835 720)">
    <rect width="245" height="155" class="box"/>
    <text x="123" y="34" text-anchor="middle" class="h">Database &amp; Audit Trail</text>
    <text x="123" y="57" text-anchor="middle" class="p">SQLite telemetry + predictions</text>
    <ellipse cx="123" cy="88" rx="42" ry="13" class="icon"/><path d="M81 88v35c0 8 19 13 42 13s42-5 42-13V88M81 105c0 8 19 13 42 13s42-5 42-13" class="icon"/>
  </g>

  <!-- analytics -->
  <g transform="translate(1120 150)">
    <rect width="500" height="540" class="analytics"/>
    <text x="250" y="38" text-anchor="middle" class="h">Analytics, Forecasting &amp; Model Selection</text>
    <g transform="translate(22 62)"><rect width="140" height="88" class="sub"/><text x="70" y="27" text-anchor="middle" class="h2">Traditional ML</text><text x="70" y="50" text-anchor="middle" class="p">Gaussian NB</text><text x="70" y="70" text-anchor="middle" class="small">baseline</text></g>
    <g transform="translate(180 62)"><rect width="140" height="88" class="selected"/><text x="70" y="27" text-anchor="middle" class="h2">Ensemble ML</text><text x="70" y="50" text-anchor="middle" class="p">Random Forest</text><text x="70" y="70" text-anchor="middle" class="small">selected by validation</text></g>
    <g transform="translate(338 62)"><rect width="140" height="88" class="sub"/><text x="70" y="27" text-anchor="middle" class="h2">Deep Neural</text><text x="70" y="50" text-anchor="middle" class="p">64-32-16 MLP</text><text x="70" y="70" text-anchor="middle" class="small">three hidden layers</text></g>
    <g transform="translate(22 172)">
      <rect width="456" height="245" class="eval"/><text x="228" y="27" text-anchor="middle" class="h2">Performance Evaluation</text>
      <path d="M152 42v185M304 42v185" stroke="#c0ccd0" stroke-width="1"/>
      <text x="76" y="58" text-anchor="middle" class="metric">ML PERFORMANCE</text>
      <text x="16" y="83" class="small">• Accuracy</text><text x="16" y="105" class="small">• Precision / recall</text><text x="16" y="127" class="small">• Macro F1</text><text x="16" y="149" class="small">• Confusion matrix</text><text x="16" y="171" class="small">• MAE / RMSE / R²</text>
      <text x="228" y="58" text-anchor="middle" class="metric">COMPUTATION</text>
      <text x="166" y="83" class="small">• Training time</text><text x="166" y="105" class="small">• Inference latency</text><text x="166" y="127" class="small">• Peak RSS</text><text x="166" y="149" class="small">• Model size</text><text x="166" y="171" class="small">• CPU time</text>
      <text x="380" y="58" text-anchor="middle" class="metric">CLOSED LOOP</text>
      <text x="318" y="83" class="small">• Control effectiveness</text><text x="318" y="105" class="small">• Response latency</text><text x="318" y="127" class="small">• Cooldown stability</text><text x="318" y="149" class="small">• False commands</text><text x="318" y="171" class="small">• Energy potential</text>
      <text x="228" y="214" text-anchor="middle" class="topic">chronological validation selects model · test remains untouched</text>
    </g>
    <g transform="translate(22 440)"><rect width="456" height="70" class="sub"/><text x="228" y="26" text-anchor="middle" class="h2">15-minute Resource Forecast</text><text x="228" y="49" text-anchor="middle" class="p">Ridge regression · CPU and memory demand</text></g>
  </g>

  <!-- decision -->
  <g transform="translate(1655 270)">
    <rect width="180" height="235" class="box"/>
    <text x="90" y="35" text-anchor="middle" class="h">Decision Engine</text>
    <text x="90" y="58" text-anchor="middle" class="p">Trigger &amp; control</text>
    <circle cx="90" cy="112" r="37" class="icon"/><path d="M90 59v17M90 148v17M37 112h17M126 112h17M53 75l12 12M115 137l12 12M127 75l-12 12M65 137l-12 12" class="icon"/><circle cx="90" cy="112" r="14" class="icon"/>
    <text x="90" y="185" text-anchor="middle" class="small">rules · approval · cooldown</text>
    <text x="90" y="207" text-anchor="middle" class="small">explainable command</text>
  </g>

  <!-- actuator -->
  <g transform="translate(220 520)">
    <rect width="260" height="195" class="box"/>
    <text x="130" y="34" text-anchor="middle" class="h">Digital-Twin Actuator</text>
    <text x="130" y="57" text-anchor="middle" class="p">Safe software response</text>
    <path d="M62 125h136M80 96h100M98 68h64" class="icon"/><circle cx="70" cy="125" r="8" class="icon"/><circle cx="171" cy="96" r="8" class="icon"/><circle cx="108" cy="68" r="8" class="icon"/>
    <text x="130" y="158" text-anchor="middle" class="small">pre-state → simulated post-state</text>
    <text x="130" y="178" text-anchor="middle" class="small">acknowledgement over MQTT</text>
  </g>

  <!-- main flow arrows -->
  <path d="M820 255 H760 V155 H160 V175" class="line"/>
  <circle cx="774" cy="155" r="15" class="num"/><text x="774" y="155" class="numtext">1</text>
  <path d="M250 260 H300" class="line"/><circle cx="275" cy="239" r="15" class="num"/><text x="275" y="239" class="numtext">2</text>
  <path d="M515 260 H555" class="line"/><circle cx="535" cy="239" r="15" class="num"/><text x="535" y="239" class="numtext">3</text>
  <path d="M515 315 V798 H835" class="line"/>
  <path d="M1080 765 H1098 V430 H1120" class="line"/><circle cx="1098" cy="595" r="15" class="num"/><text x="1098" y="595" class="numtext">4</text>
  <path d="M1620 390 H1655" class="line"/><circle cx="1638" cy="369" r="15" class="num"/><text x="1638" y="369" class="numtext">5</text>
  <path d="M1745 505 V905 H160 V345" class="feedback"/><circle cx="1745" cy="676" r="15" class="num"/><text x="1745" y="676" class="numtext">6</text><text x="1240" y="897" class="topic">control command via MQTT</text>
  <path d="M160 345 V618 H220" class="line"/><circle cx="160" cy="483" r="15" class="num"/><text x="160" y="483" class="numtext">7</text>
  <path d="M350 520 V455 H645 V345" class="feedback"/><circle cx="520" cy="455" r="15" class="num"/><text x="520" y="455" class="numtext">8</text><text x="365" y="443" class="topic">ack + post-action state</text>

  <text x="955" y="705" text-anchor="middle" class="topic">processed telemetry · predictions · forecasts · commands · immutable audit records</text>
  <text x="950" y="1005" text-anchor="middle" class="subtitle">All actions are simulated. Consolidation and disk-clearing require operator approval. No production server is modified.</text>
</svg>
