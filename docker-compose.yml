services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: team11-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
  node-red:
    image: nodered/node-red:4.0
    container_name: team11-node-red
    depends_on: [mqtt]
    ports:
      - "1880:1880"
    volumes:
      - ./infra/nodered:/data
volumes:
  mqtt-data:
